<!doctype html>
<!-- og-image.png 生成源(1200×630):Playwright 定格截图产出 public/og-image.png;改此文件后重截即可再生 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(160deg, #FDF4EC 0%, #F9E7D9 100%);
    color: #5A4A42;
    display: flex; align-items: center;
    position: relative;
  }
  .copy { padding-left: 84px; width: 720px; }
  .logo { display: flex; align-items: center; gap: 16px; margin-bottom: 40px; }
  .logo svg { width: 56px; height: 56px; }
  .logo .name { font-size: 30px; font-weight: 800; color: #8C4A3A; letter-spacing: .04em; }
  .logo .latin { font-size: 15px; letter-spacing: .22em; color: #B0917F; margin-top: 2px; }
  h1 { font-size: 58px; line-height: 1.25; font-weight: 800; color: #8C4A3A; margin-bottom: 26px; }
  .sub { font-size: 24px; color: #8C6A54; line-height: 1.6; margin-bottom: 34px; }
  .pills { display: flex; gap: 12px; margin-bottom: 40px; }
  .pill {
    font-size: 19px; font-weight: 600; color: #A85A48;
    background: #F7E3D7; border: 1px solid rgba(160,90,72,.14);
    padding: 9px 22px; border-radius: 999px;
  }
  .note { font-size: 16px; color: #B0917F; }
  .shot {
    position: absolute; right: 72px; top: 64px;
    width: 300px; padding: 11px; border-radius: 40px;
    background: #241E1B; box-shadow: 0 26px 60px rgba(160,90,72,.30);
    transform: rotate(4deg);
  }
  .shot img { display: block; width: 100%; border-radius: 30px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E3A381"/><stop offset="1" stop-color="#D2795C"/>
        </linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#g)"/>
        <circle cx="32" cy="32" r="15" fill="none" stroke="#FFFDFB" stroke-width="4"/>
        <circle cx="32" cy="32" r="5.5" fill="#FFFDFB"/>
      </svg>
      <div>
        <div class="name">肤镜</div>
        <div class="latin">SKINLENS</div>
      </div>
    </div>
    <h1>拍一张正脸,<br/>读出你的肤质四维</h1>
    <div class="sub">AI 分区分析 · 16 型肤质定位 · 护肤建议</div>
    <div class="pills">
      <span class="pill">油脂</span><span class="pill">敏感</span><span class="pill">痘痘</span><span class="pill">色沉</span>
    </div>
    <div class="note">结果仅供护肤参考,不构成医疗建议</div>
  </div>
  <div class="shot"><img src="public/shots/report.png" alt="" /></div>
</body>
</html>
